name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      # marp_render は Chrome をサンドボックス有効のまま起動する（--no-sandbox を既定で付けない）。
      # ubuntu-24.04 のランナーは非特権ユーザー名前空間を AppArmor で制限しており、
      # Chrome のサンドボックスが起動できないことがあるため、テスト環境だけ制限を外す。
      - name: Allow Chrome's sandbox on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - run: npm test

      - run: node e2e.mjs

  vendor-checksum:
    name: vendor checksum (jsquash-webp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # CHECKSUMS.sha256 pins the exact bytes of the vendored, unmodified
      # @jsquash/webp v1.5.0 subset (comment lines starting with "#" are
      # ignored by shasum). The web version (tools.first-ch.com) vendors the
      # same v1.5.0 subset and verifies it independently in its own CI, so a
      # silent drift between the two copies can't happen unnoticed.
      - name: Verify vendor/jsquash-webp against CHECKSUMS.sha256
        working-directory: vendor/jsquash-webp
        run: shasum -a 256 -c CHECKSUMS.sha256

  package-integrity:
    name: package metadata & tarball integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm ci

      - name: Verify published tarball contents
        run: |
          node <<'EOF'
          const { execSync } = require('node:child_process');

          const out = execSync('npm pack --dry-run --json', { encoding: 'utf8' });
          const files = JSON.parse(out)[0].files.map((f) => f.path);

          // Files that must ship in the npm tarball (server runtime + WebP
          // codec binary + both codec license files, since BSD-3-Clause
          // requires the notice/conditions/disclaimer to accompany binary
          // redistribution).
          const required = [
            'server.mjs',
            'lib.mjs',
            'fs-safe.mjs',
            'webp.mjs',
            'package.json',
            'vendor/jsquash-webp/codec/enc/webp_enc_simd.wasm',
            'vendor/jsquash-webp/LICENSE',
            'vendor/jsquash-webp/codec/LICENSE.codec.md',
          ];
          // Dev-only files that must NOT leak into the published package.
          const forbidden = ['test.mjs', 'e2e.mjs'];

          const missing = required.filter((f) => !files.includes(f));
          const leaked = forbidden.filter((f) => files.includes(f));

          if (missing.length || leaked.length) {
            console.error('Tarball content check FAILED.');
            if (missing.length) console.error(' missing required files:', missing);
            if (leaked.length) console.error(' forbidden dev files present:', leaked);
            console.error('Full file list:', files);
            process.exit(1);
          }

          console.log('Tarball content check passed. Files:');
          console.log(files.join('\n'));
          EOF

      # 利用者が npx で入れる依存を検査する。package.json の overrides は依存として
      # 入れる側には効かないため、リポジトリ直下の npm audit では見えない脆弱性が残りうる
      # （0.34.1 で実際にあった）。公開物を空のキャッシュで入れ直し、moderate 以上が無いことを確かめる。
      # 既知の例外は @xmldom/xmldom だけ: marp-core → mathjax-full → speech-rule-engine が 0.9.10 を
      # 版固定で要求し、overrides でしか直せない。同梱（bundleDependencies）で直そうとしたが、
      # npm 11 は同梱した部品への overrides を公開時に拒否する（EBUNDLEOVERRIDE・2026-10-10）。
      # 上流が直したらこの例外を消す。それ以外の moderate 以上はこれまでどおり止める。
      - name: Audit the dependency tree that npx users actually install
        run: |
          set -eu
          work="$RUNNER_TEMP/consumer"
          mkdir -p "$work/pack" "$work/app"
          npm pack --pack-destination "$work/pack" >/dev/null
          tgz="$(find "$work/pack" -maxdepth 1 -name '*.tgz' -print -quit)"
          cd "$work/app"
          npm init -y >/dev/null
          npm install --cache "$work/cache" --no-audit --no-fund "$tgz"
          npm audit --cache "$work/cache" --omit=dev --json > "$work/audit.json" || true
          node - "$work/audit.json" <<'EOF'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const allowed = new Set(['@xmldom/xmldom', 'speech-rule-engine', 'mathjax-full', '@marp-team/marp-core']);
          const bad = Object.entries(r.vulnerabilities || {})
            .filter(([, v]) => ['moderate', 'high', 'critical'].includes(v.severity))
            .filter(([name]) => !allowed.has(name));
          for (const [name, v] of Object.entries(r.vulnerabilities || {})) console.log(`${v.severity}\t${name}`);
          if (bad.length) { console.error('moderate 以上の脆弱性（既知の例外以外）: ' + bad.map(([n]) => n).join(', ')); process.exit(1); }
          console.log('既知の例外（@xmldom/xmldom 経由）以外に moderate 以上はありません');
          EOF

      - name: Verify version & mcpName consistency across metadata files
        run: |
          node <<'EOF'
          const fs = require('node:fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const server = JSON.parse(fs.readFileSync('server.json', 'utf8'));
          const plugin = JSON.parse(
            fs.readFileSync('plugins/firstch-tools/.claude-plugin/plugin.json', 'utf8'),
          );
          const mcpConfig = JSON.parse(
            fs.readFileSync('plugins/firstch-tools/.mcp.json', 'utf8'),
          );

          const pkgVersion = pkg.version;
          const npxArgs = mcpConfig.mcpServers?.['firstch-tools']?.args ?? [];
          const npxArg = npxArgs.find((a) => a.startsWith('@first-ch/tools-mcp@'));
          const npxVersion = npxArg ? npxArg.split('@').pop() : undefined;

          const versions = {
            'package-lock.json#version': lock.version,
            'package-lock.json#packages[""]#version': lock.packages?.['']?.version,
            'server.json#version': server.version,
            'server.json#packages[0].version': server.packages?.[0]?.version,
            'plugins/firstch-tools/.claude-plugin/plugin.json#version': plugin.version,
            'plugins/firstch-tools/.mcp.json npx arg version': npxVersion,
          };

          const errors = [];
          for (const [label, v] of Object.entries(versions)) {
            if (v !== pkgVersion) {
              errors.push(
                `version mismatch: ${label} = ${JSON.stringify(v)}, expected ${JSON.stringify(pkgVersion)} (package.json#version)`,
              );
            }
          }
          if (pkg.mcpName !== server.name) {
            errors.push(
              `mcpName mismatch: package.json#mcpName = ${JSON.stringify(pkg.mcpName)}, server.json#name = ${JSON.stringify(server.name)}`,
            );
          }

          if (errors.length) {
            console.error('Metadata consistency check FAILED:');
            for (const e of errors) console.error(' -', e);
            process.exit(1);
          }

          console.log('Metadata consistency check passed. version =', pkgVersion, ' mcpName =', pkg.mcpName);
          EOF

  # プラグインのピンは、npm公開済みの版か、このpushで公開する
  # package.json の版だけを許可する。後者を許可しないと、mainへ入る前に
  # npm公開を要求する循環になり、OIDCによる自動publishが成立しない。
  plugin-pin-published:
    name: plugin pin is published or the current release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check pinned versions are published or current
        run: |
          set -eu
          candidate="$(node -p "require('./package.json').version")"
          fail=0
          for f in plugins/*/.mcp.json; do
            pins=$(grep -o '@first-ch/tools-mcp@[0-9][0-9.]*' "$f" || true)
            for pin in $pins; do
              ver="${pin##*@}"
              if [ "$ver" = "$candidate" ]; then
                echo "OK: $f pins $ver (current release candidate)"
              elif npm view "@first-ch/tools-mcp@$ver" version >/dev/null 2>&1; then
                echo "OK: $f pins $ver (published)"
              else
                echo "NG: $f pins $ver, which is neither published nor the current package version $candidate"
                fail=1
              fi
            done
          done
          exit $fail

  # mainへ入った新しいpackage versionをnpmへ無承認で公開する。
  # 認証はnpm Trusted Publishing (OIDC)を使い、長寿命のNPM_TOKENは置かない。
  # 同じversionが既にある場合は内容一致を確認して成功終了し、内容が違えば
  # versionの上げ忘れとして停止する。publish成功時だけvX.Y.Zタグを作る。
  publish:
    name: publish npm package from main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, vendor-checksum, package-integrity, plugin-pin-published]
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # npm Trusted Publishingにはnpm CLI 11.5.1以上が必要。
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12.0.2

      - run: npm ci

      - name: Decide whether this version needs publishing
        id: release
        run: |
          set -eu
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          spec="$name@$version"

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if npm view "$spec" version >/dev/null 2>&1; then
            local_dir="$RUNNER_TEMP/local-package"
            remote_dir="$RUNNER_TEMP/remote-package"
            local_extract="$RUNNER_TEMP/local-extract"
            remote_extract="$RUNNER_TEMP/remote-extract"
            mkdir -p "$local_dir" "$remote_dir" "$local_extract" "$remote_extract"

            npm pack --pack-destination "$local_dir" >/dev/null
            npm pack "$spec" --pack-destination "$remote_dir" >/dev/null
            local_tgz="$(find "$local_dir" -maxdepth 1 -name '*.tgz' -print -quit)"
            remote_tgz="$(find "$remote_dir" -maxdepth 1 -name '*.tgz' -print -quit)"
            tar -xzf "$local_tgz" -C "$local_extract"
            tar -xzf "$remote_tgz" -C "$remote_extract"

            if ! diff -qr "$local_extract/package" "$remote_extract/package"; then
              echo "Version $spec is already published with different contents." >&2
              echo "Bump all synchronized version fields before pushing package changes." >&2
              exit 1
            fi

            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$spec is already published with identical contents; skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$spec is not on npm; it will be published after all CI gates."
          fi

      - name: Publish to npm with Trusted Publishing
        if: steps.release.outputs.publish == 'true'
        run: npm publish

      - name: Verify npm latest
        if: steps.release.outputs.publish == 'true'
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          # npm の latest 反映は実測で約1分かかる。15秒×20回＝最大約5分待つ。
          attempts=20
          for attempt in $(seq 1 "$attempts"); do
            published="$(npm view "$PACKAGE_NAME" version 2>/dev/null || true)"
            if [ "$published" = "$PACKAGE_VERSION" ]; then
              echo "Verified npm latest: $PACKAGE_NAME@$PACKAGE_VERSION"
              exit 0
            fi
            echo "Waiting for npm propagation ($attempt/$attempts): latest=${published:-unavailable}"
            if [ "$attempt" -lt "$attempts" ]; then
              sleep 15
            fi
          done
          echo "npm latest did not become $PACKAGE_VERSION" >&2
          exit 1

      - name: Tag the published commit
        if: steps.release.outputs.publish == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          tag="v$PACKAGE_VERSION"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            target="$(git rev-list -n 1 "$tag")"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "$tag already points to $target, not $GITHUB_SHA" >&2
              exit 1
            fi
            echo "$tag already points to this commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
